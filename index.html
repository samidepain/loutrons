<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{var t=localStorage.getItem('loutrons-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Loutrons</title>
<meta name="description" content="Carnet d’entraînement de musculation. Tes données restent sur ton téléphone.">
<meta name="theme-color" content="#F5F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loutrons">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Archivo (licence OFL, voir fonts/) hébergée avec l'appli pour marcher hors connexion : titres et chiffres, graisse 800, largeur 62 à 125 % (62 % pour les noms dans les cases du calendrier) ; le texte est dans la police du téléphone */
@font-face{font-family:'Archivo';font-style:normal;font-weight:800;font-stretch:62% 125%;font-display:swap;src:url(fonts/archivo.woff2) format('woff2')}
/* Layout: carnet d'entraînement une colonne (max 640px), en-tête collant, barre d'onglets en bas, minuteur de repos au-dessus */
:root{
  --bg:#F5F5F4; --surface:#FFFFFF; --surface-2:#EDEDEB; --line:#DEDEDB; --well:#FFFFFF;
  --ink:#0A0A0A; --muted:#5C5C5C;
  --accent:#FF7A1A; --accent-ink:#A84300; --accent-soft:#FFE8D6; --on-accent:#000000;
  --court:#3D3D3D; --court-soft:#EDEDED;
  --fam-salle:#A84300; --fam-cardio:#1F6FD1; --fam-collectif:#7B3FD6; --fam-autre:#3D3D3D;
  --good:#186B3C; --good-soft:#DFF1E6; --warn:#7A5E00; --warn-soft:#F7EDC8; --bad:#B3261E; --bad-soft:#F8E1E2;
  --f-display:'Archivo','Arial Black',system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,sans-serif;
  --r:20px; --tabs-h:62px; --shade:rgba(0,0,0,.18);
  /* Dark Glow : dégradé de l'orange (l'orange officiel au centre), matière des cartes, trois niveaux de lumière, verre, halo d'écran */
  --grad-fire:linear-gradient(135deg,#FFB347 0%,#FF7A1A 50%,#FF4D00 100%);
  --card-top:#FFFFFF; --card-bot:#FFFFFF; --card-sh:0 1px 2px rgba(0,0,0,.05),0 8px 24px -6px rgba(0,0,0,.08);
  --edge:linear-gradient(140deg,rgba(168,67,0,.4),rgba(255,122,26,.1) 40%,rgba(0,0,0,.04) 72%); --ambient:rgba(255,122,26,.07);
  --glow-1:0 1px 3px rgba(168,67,0,.14); --glow-2:0 0 0 1px rgba(168,67,0,.35),0 3px 10px rgba(255,122,26,.14); --glow-3:0 8px 18px -8px rgba(230,90,0,.45);
  --glass:rgba(255,255,255,.72); --glass-line:rgba(0,0,0,.07); --lens:rgba(10,10,10,.06); --lens-line:rgba(0,0,0,.05); --lens-hi:rgba(255,255,255,.95); --halo:rgba(255,122,26,.07);
  --ring-glow:0 0 2px rgba(255,122,26,.2);
  --grad-gold:linear-gradient(135deg,#FFE08A 0%,#FFB347 55%,#FF7A1A 100%); --edge-gold:linear-gradient(140deg,#E0A21A,#FFB347 40%,rgba(255,122,26,.2) 75%); --ambient-gold:rgba(255,190,70,.12); --gold-ink:#8A5A00;
  --glow-gold:0 0 0 3px rgba(255,190,70,.18),0 4px 12px -4px rgba(220,140,0,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0D; --surface:#141414; --surface-2:#1F1F1F; --line:#2E2E2E;
  --ink:#FFFFFF; --muted:#A3A3A3;
  --accent:#FF7A1A; --accent-ink:#FF7A1A; --accent-soft:#331A05; --on-accent:#000000;
  --court:#D4D4D4; --court-soft:#1F1F1F;
  --fam-salle:#FF7A1A; --fam-cardio:#4DA3FF; --fam-collectif:#B48CFF; --fam-autre:#D4D4D4;
  --good:#52C383; --good-soft:#132D1D; --warn:#F2C94C; --warn-soft:#332A0E; --bad:#FF8A80; --bad-soft:#3A1A1C;
  --shade:rgba(0,0,0,.6);
  --well:#000000;
  --grad-fire:linear-gradient(135deg,#FFB347 0%,#FF7A1A 50%,#FF4D00 100%);
  --card-top:#171717; --card-bot:#111111; --card-sh:inset 0 1px 0 rgba(255,255,255,.06);
  --edge:linear-gradient(140deg,rgba(255,150,60,.5),rgba(255,122,26,.1) 38%,rgba(255,255,255,.05) 72%); --ambient:rgba(255,122,26,.11);
  --glow-1:0 0 8px rgba(255,122,26,.22); --glow-2:0 0 0 1px rgba(255,140,50,.4),0 0 12px rgba(255,122,26,.16); --glow-3:0 8px 24px -8px rgba(255,105,20,.6),0 0 28px rgba(255,90,0,.14);
  --glass:rgba(24,24,24,.62); --glass-line:rgba(255,255,255,.1); --lens:rgba(255,255,255,.09); --lens-line:rgba(255,255,255,.07); --lens-hi:rgba(255,255,255,.18); --halo:rgba(255,122,26,.08);
  --ring-glow:0 0 4px rgba(255,122,26,.4);
  --grad-gold:linear-gradient(135deg,#FFE08A 0%,#FFB347 55%,#FF7A1A 100%); --edge-gold:linear-gradient(140deg,#FFE08A,#FFB347 40%,rgba(255,122,26,.25) 75%); --ambient-gold:rgba(255,190,70,.14); --gold-ink:#FFC85C;
  --glow-gold:0 0 0 3px rgba(255,190,70,.12),0 0 16px rgba(255,180,60,.32);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0B0D; --surface:#141414; --surface-2:#1F1F1F; --line:#2E2E2E;
  --ink:#FFFFFF; --muted:#A3A3A3;
  --accent:#FF7A1A; --accent-ink:#FF7A1A; --accent-soft:#331A05; --on-accent:#000000;
  --court:#D4D4D4; --court-soft:#1F1F1F;
  --fam-salle:#FF7A1A; --fam-cardio:#4DA3FF; --fam-collectif:#B48CFF; --fam-autre:#D4D4D4;
  --good:#52C383; --good-soft:#132D1D; --warn:#F2C94C; --warn-soft:#332A0E; --bad:#FF8A80; --bad-soft:#3A1A1C;
  --shade:rgba(0,0,0,.6);
  --well:#000000;
  --grad-fire:linear-gradient(135deg,#FFB347 0%,#FF7A1A 50%,#FF4D00 100%);
  --card-top:#171717; --card-bot:#111111; --card-sh:inset 0 1px 0 rgba(255,255,255,.06);
  --edge:linear-gradient(140deg,rgba(255,150,60,.5),rgba(255,122,26,.1) 38%,rgba(255,255,255,.05) 72%); --ambient:rgba(255,122,26,.11);
  --glow-1:0 0 8px rgba(255,122,26,.22); --glow-2:0 0 0 1px rgba(255,140,50,.4),0 0 12px rgba(255,122,26,.16); --glow-3:0 8px 24px -8px rgba(255,105,20,.6),0 0 28px rgba(255,90,0,.14);
  --glass:rgba(24,24,24,.62); --glass-line:rgba(255,255,255,.1); --lens:rgba(255,255,255,.09); --lens-line:rgba(255,255,255,.07); --lens-hi:rgba(255,255,255,.18); --halo:rgba(255,122,26,.08);
  --ring-glow:0 0 4px rgba(255,122,26,.4);
  --grad-gold:linear-gradient(135deg,#FFE08A 0%,#FFB347 55%,#FF7A1A 100%); --edge-gold:linear-gradient(140deg,#FFE08A,#FFB347 40%,rgba(255,122,26,.25) 75%); --ambient-gold:rgba(255,190,70,.14); --gold-ink:#FFC85C;
  --glow-gold:0 0 0 3px rgba(255,190,70,.12),0 0 16px rgba(255,180,60,.32);
  color-scheme:dark;
}
/* Échelles du design system, communes aux deux thèmes : espacements, rayons, texte, mouvement */
:root{
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
  --r-sm:12px; --r-md:16px; --r-pill:999px;
  --t-hero:36px; --t-h1:28px; --t-h2:20px; --t-h3:18px; --t-body:17px; --t-small:15px; --t-cap:13px;
  --ease:cubic-bezier(.32,.72,0,1); --dur-tap:.14s; --dur-state:.24s; --dur-win:.65s;
  --press:.96; --press-sm:.93; --dim:.45;
}
*{box-sizing:border-box}
/* Halo d'écran : la « lumière de la salle » en haut de chaque écran, qui défile avec lui (pas pendant la séance : concentration) */
body{background:radial-gradient(60% 100% at 50% 0%,var(--halo),transparent 70%) center top/100% 420px no-repeat,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--t-body);line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
/* Appui : les boutons s'enfoncent un peu, les lignes de liste se colorent, comme dans les applis du téléphone */
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn,.chip,.me,.cday,.tab svg{transition:transform var(--dur-tap) ease,background-color var(--dur-tap) ease}
.btn:active:not(:disabled),.me:active{transform:scale(var(--press))}
.chip:active:not(:disabled),.cday:active{transform:scale(var(--press-sm))}
.tab:active svg{transform:scale(.86)}
.pick:active{background:var(--line)}
.hitem:active{background:var(--surface-2)}
.link:active{opacity:.55}
body:has(#app .sess-head){background:var(--bg)}
/* Passage d'un écran à l'autre (js/nav.js) : ancien écran dans un calque fixe, voile sur l'écran du dessous */
.nav-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.nav-layer.over{z-index:3}
.nav-shade{position:absolute;inset:0;background:var(--shade);opacity:0}
.nav-top{position:relative;z-index:2;background:radial-gradient(60% 100% at 50% 0%,var(--halo),transparent 70%) center top/100% 420px no-repeat,var(--bg);min-height:100vh;box-shadow:0 0 28px rgba(0,0,0,.14)}
.nav-clip{position:absolute;top:0;height:100%;overflow:hidden}
.nav-layer .nav-top{position:absolute}
.nav-sheet{border-radius:16px 16px 0 0}
h1,h2,h3{font-family:var(--f-display);font-weight:800;font-stretch:125%;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:var(--t-h1)} h2{font-size:var(--t-h2)} h3{font-size:var(--t-h3)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-stretch:100%;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* États communs : désactivé, chargement (le seul cercle qui tourne, le temps d'attendre), survol à la souris seulement */
.chip:disabled,.pick:disabled,.step:disabled,button.plus:disabled,.f input:disabled,.f select:disabled{opacity:var(--dim);cursor:not-allowed}
.loading{display:flex;align-items:center;gap:var(--s-2);color:var(--muted);font-size:var(--t-small);padding:var(--s-2) 0}
.loading::before{content:"";flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (hover:hover) and (pointer:fine){.btn:hover:not(:disabled){filter:brightness(1.06)}.pick:hover:not(:disabled):not(.static),.hitem:hover{background:var(--line)}.link:hover{text-decoration:underline}}
.small{font-size:var(--t-small)}
.label{font-size:var(--t-small);font-weight:600;color:var(--muted)}

/* Hors d'Aujourd'hui : plus de barre « LOUTRONS » ; le rond du profil flotte en haut à droite, à côté du titre de l'écran */
body.brandless .top{position:absolute;left:0;right:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
body.brandless .brand{visibility:hidden}
/* L'en-tête transparent flotte sur le haut de l'écran : il laisse passer les touchers (bouton « ‹ … »), sauf le rond du profil */
body.brandless .top{pointer-events:none}
body.brandless .me{pointer-events:auto}
/* Ceinture et bretelles (iPhone) : le bouton « ‹ … » passe au-dessus de l'en-tête, même si celui-ci garde ses touchers */
#app [data-back]{position:relative;z-index:21}
body.in-sheet .top{display:none}
body.brandless:not(.in-sheet) #app > :first-child:not(.sess-head){padding-right:48px}
body.brandless .sess-head{top:env(safe-area-inset-top,0px)}
body.brandless .sess-head > .sess-top{padding-right:48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-stretch:125%;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
.brand img{width:32px;height:32px;display:block}
.me{width:36px;height:36px;flex:none;border-radius:50%;border:none;padding:0;background:var(--grad-fire);color:var(--on-accent);font-family:var(--f-display);font-weight:800;font-stretch:100%;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center}
.me svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.me.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.me{position:relative}
.me svg.gear{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;padding:1px;border-radius:50%;background:var(--bg);color:var(--ink);stroke:currentColor;fill:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill.court{background:var(--court-soft);color:var(--court)}

main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px calc(var(--tabs-h) + 96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
/* Minuteur affiché (jusqu'à 2 lignes, environ 120 px) : plus de place en bas de page, pour ne pas cacher le dernier bouton */
body:has(#restbar:not([hidden])) main{padding-bottom:calc(var(--tabs-h) + 140px + env(safe-area-inset-bottom,0px))}
/* Carte : dégradé vertical à peine visible et reflet d'un pixel en haut (ombre douce en clair), sans bordure */
.card{background:linear-gradient(180deg,var(--card-top),var(--card-bot));box-shadow:var(--card-sh);border:none;border-radius:var(--r);padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
.card.flat{background:transparent;box-shadow:none;border:none;padding:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}

/* Boutons en pilule, sans bordure : orange pour l'action principale, gris pour les autres */
.btn{border:none;background:var(--surface-2);border-radius:var(--r-pill);padding:10px 18px;font-weight:600;min-height:44px}
.btn.primary{background:var(--grad-fire);color:var(--on-accent);box-shadow:var(--glow-1),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.primary.big{box-shadow:var(--glow-3),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.primary:active:not(:disabled){box-shadow:var(--glow-1),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.ghost{background:transparent;color:var(--accent-ink)}
.btn.danger{color:var(--bad);background:var(--surface-2)}
.btn.big{font-size:17px;font-weight:700;padding:14px 20px;min-height:52px;width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:15px}
.btn:disabled{opacity:var(--dim);cursor:not-allowed;box-shadow:none}
.link{background:none;border:none;color:var(--accent-ink);font-weight:600;padding:6px 0;min-height:36px}

.hero-date{font-size:15px;font-weight:600;color:var(--muted)}
/* Aujourd'hui (3.9) : salutation, dernière séance, Émile au repos, record, macros */
.greet{display:flex;flex-direction:column;gap:var(--s-1);min-width:0}
.g-hi{font-family:var(--f-display);font-size:var(--t-h2);font-weight:800;font-stretch:125%;line-height:1.1;overflow-wrap:anywhere;text-wrap:balance}
.plan .last{border-top:1px solid var(--line);padding-top:var(--s-3)}
.plan-rest{display:flex;align-items:center;gap:var(--s-3)}
.plan-rest img{width:44px;height:44px;border-radius:50%;flex:none}
.rec-t{gap:2px;min-width:0}
.rec-t span{overflow-wrap:anywhere}
.line-h.e-fold img{width:32px;height:32px;border-radius:50%;flex:none;border:2px solid var(--accent);background:#000000}
.line-h.e-fold .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Bande de semaine : nom court sur une ligne (le nom complet est dans le détail du jour) */
.cal-week .cday .s{min-height:0;-webkit-line-clamp:1;white-space:nowrap;font-size:13px}
.mini-macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-3)}
.mini-macros .m{display:flex;flex-direction:column;gap:var(--s-1);font-size:var(--t-cap);min-width:0}
.mini-macros .m b{font-size:var(--t-small);white-space:nowrap}
@media (max-width:360px){.mini-macros{gap:var(--s-2)}.mini-macros .m b{font-size:var(--t-cap)}}
.alert{border-radius:var(--r);padding:12px 14px;background:var(--bad-soft);color:var(--bad);font-weight:600}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.good{background:var(--good-soft);color:var(--good)}
.alert.info{background:var(--surface-2);color:var(--ink)}

/* Carte vedette (une par écran) : liseré qui attrape la lumière en haut à gauche, lumière ambiante en haut à droite */
.card.hero,.plan{border:1px solid transparent;background:radial-gradient(90% 120% at 100% 0%,var(--ambient),transparent 60%) padding-box,linear-gradient(180deg,var(--card-top),var(--card-bot)) padding-box,var(--edge) border-box}
.plan .name{font-family:var(--f-display);font-size:var(--t-hero);font-weight:800;font-stretch:125%;line-height:1;overflow-wrap:anywhere}
/* Calendrier */
.cal-week,.cal-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-month{gap:4px;touch-action:pan-y}
.cal-h{font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.cal-title{flex:1;text-align:center}
.cday{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:10px;border:1px solid transparent;background:var(--surface-2);min-width:0;color:inherit}
.cal-month .cday{padding:6px 0 5px;min-height:44px}
@media (max-width:360px){.cal-week .cday{padding-inline:0}.cday .s{letter-spacing:-.02em}}
.cday .dn{font-size:13px;font-weight:600;color:var(--muted)}
.cday .dd{font-family:var(--f-display);font-weight:800;font-stretch:100%;font-size:18px;line-height:1}
/* Nom de la séance dans une case : Archivo étroite, seule police assez serrée pour « Course » ou « Football » dans une case de 37 px */
.cday .s{font-family:var(--f-display);font-weight:800;font-stretch:62%;font-size:12px;line-height:1.1;text-align:center;max-width:100%;min-height:2.2em;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* Points du calendrier : la couleur dit la famille (salle, cardio, sports collectifs, autre), la forme dit l'état (plein : fait, anneau : prévu, point entouré : en cours) */
.mks{display:flex;gap:2px;justify-content:center;min-height:7px}
.mk{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none;box-sizing:border-box;--c:var(--muted)}
.mk.fam-salle{--c:var(--fam-salle)} .mk.fam-cardio{--c:var(--fam-cardio)} .mk.fam-collectif{--c:var(--fam-collectif)} .mk.fam-autre{--c:var(--fam-autre)}
.mk.done{background:var(--c)}
.mk.planned{border:2px solid var(--c);background:transparent}
.mk.active{background:var(--c);box-shadow:0 0 0 1.5px var(--surface-2),0 0 0 3px var(--c)}
@media (max-width:360px){.mk{width:6px;height:6px}}
/* Jour choisi (fond plein) : un liseré de la couleur du fond garde chaque point visible */
.cday.sel .mk{box-shadow:0 0 0 1.5px var(--bg)}
/* jour choisi : la séance en cours garde son anneau, autour du liseré de fond */
.cday.sel .mk.active{box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--c)}
.cal-detail .mk{margin-right:6px;vertical-align:1px}
/* Contours d'état en orange « texte » : 3:1 au moins sur les fonds gris du thème clair */
.cday.today{border-color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-ink)}
.cday.sel{background:var(--grad-fire);color:var(--on-accent);box-shadow:var(--glow-2)}
.cday.sel .dn{color:var(--on-accent)}
/* Aujourd'hui dans la semaine : fond orangé léger et contour, sans lumière (le seul éclat de l'écran va au bouton de la séance) */
.cal-week .cday.today:not(.sel){background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1.5px var(--accent-ink)}
.cal-week .cday.today:not(.sel) .dn{color:var(--accent-ink)}
.cal-week .cday.today:not(.sel) .mk{box-shadow:0 0 0 1.5px var(--accent-soft)}
.cal-week .cday.today:not(.sel) .mk.active{box-shadow:0 0 0 1.5px var(--accent-soft),0 0 0 3px var(--c)}
.cal-week .cday:not(.today) .mk.done{box-shadow:0 0 6px var(--c)}
.legend i.mk{width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.cal-detail{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.card > .cal-detail{border-top:none;padding-top:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:44px;min-height:44px;border-radius:999px;border:none;background:var(--surface-2);font-family:var(--f-display);font-weight:800;font-stretch:100%;font-size:17px;padding:0 10px}
.chip.txt{font-family:var(--f-body);font-weight:600;font-size:15px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days .chip{min-width:0;padding:0}
/* Rotation (Planning) : rang, nom, ↑ et ↓ (boutons ronds de la séance), case « Dans la rotation » sur la ligne suivante */
.rot-row{display:grid;grid-template-columns:22px minmax(0,1fr) 44px 44px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.rot-row .rot-name{font-weight:700;overflow-wrap:anywhere}
.rot-row .rot-n{color:var(--muted)}
.rot-row .step{background:var(--surface-2)}
.rot-row .step:disabled{opacity:.35}
.rot-in{grid-column:2 / -1;display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px;color:var(--muted)}
.rot-in input{width:22px;height:22px;accent-color:var(--accent)}
.rot-row.off .rot-name{color:var(--muted);font-weight:400}
/* Prévoir tes séances : jour et date dans la puce */
.plan-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.15;min-height:48px}
.plan-chip .num{font-weight:700}
.plan-chip:disabled{opacity:.4}
.chip.on{background:var(--grad-fire);color:var(--on-accent);box-shadow:var(--glow-2)}
.chip.on.hi{background:var(--bad);color:#fff;box-shadow:none}
.chip.sec.on{background:var(--court);color:var(--bg);box-shadow:none}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg .chip{white-space:nowrap;font-family:var(--f-body);font-weight:600;font-size:15px}
/* Sous-onglets et cases posés sur le fond de l'écran : matière des cartes, pour rester visibles sur le fond clair */
.seg .chip:not(.on),#app > .stats .stat,.end .stat,#app > .pick{background:linear-gradient(180deg,var(--card-top),var(--card-bot));box-shadow:var(--card-sh)}
.toggle{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:none}
.toggle input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:15px;font-weight:600;color:var(--muted)}
/* Champs remplis, sans bordure ; contour orange pendant la saisie */
.f input,.f select,input.plain,input.n,select{border:none;border-radius:12px;background:var(--surface-2);padding:9px 12px;min-height:44px;max-width:100%;width:100%}
.f input:focus,.f select:focus,input.plain:focus,input.n:focus,select:focus,textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent-ink)}
input.n{font-family:var(--f-display);font-size:20px;font-weight:800;font-stretch:100%;font-variant-numeric:tabular-nums}

/* Séance */
.sess-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:10;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:6px}
/* En-tête compact : nom et chrono sur une ligne, barre d'avancement et compteur, puis la semaine */
.sess-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.sess-top h1{overflow-wrap:anywhere;line-height:1.1}
.sess-prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.sess-prog .num{font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad-fire);border-radius:999px;box-shadow:var(--glow-1)}
.clock{font-family:var(--f-display);font-size:28px;font-weight:800;font-stretch:100%;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--warn)} .clock.bad{color:var(--bad)}
.group{border:1px solid var(--line);border-radius:calc(var(--r) + 4px);padding:8px;display:flex;flex-direction:column;gap:8px}
.group > .gh{color:var(--accent-ink);font-size:15px;font-weight:600;padding:0 4px}
/* Éditeur de séance : lier un exercice au suivant (superset), en bas de sa case */
.item .ss-link{align-self:flex-start;min-height:44px;text-align:left}
.ex .exname{font-family:var(--f-display);font-size:20px;font-weight:800;font-stretch:100%;line-height:1.15}
.presc{font-size:15px;color:var(--muted)}
.target{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.target .tl{flex:none}
.target p{font-size:15px;min-width:0}
/* Pastilles neutres posées dans la case grise : fond de l'écran pour garder leur forme */
.target .pill:not(.good):not(.warn):not(.bad):not(.acc){background:var(--well)}
.last{font-size:15px;color:var(--muted)}
.last b{color:var(--ink);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.sn{font-family:var(--f-display);font-weight:800;font-stretch:100%;color:var(--muted);text-align:center;font-size:18px}
.fld{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:none;border-radius:12px;padding:0 10px;min-height:46px;min-width:0}
.fld input{border:none;background:transparent;width:100%;min-width:0;font-family:var(--f-display);font-size:22px;font-weight:800;font-stretch:100%;font-variant-numeric:tabular-nums;padding:6px 0;outline:none}
.fld span{font-size:13px;color:var(--muted);flex:none}
.fld:focus-within{box-shadow:inset 0 0 0 2px var(--accent-ink)}
.plyo-lab{font-family:var(--f-display);font-size:20px;font-weight:800;font-stretch:100%}
/* Petits écrans (iPhone SE) : les chiffres d'Archivo sont plus larges, on resserre les colonnes pour que « 102,5 » et « 12 » tiennent, même dans un superset */
@media (max-width:360px){
  .setrow{grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 44px;gap:6px}
  .fld{padding:0 6px;gap:2px}
  .fld input{font-size:19px;min-height:44px}
  .fld span{font-size:13px}
  .ex .exname{font-size:19px}
  .group{padding:6px}
  .group .fld input{font-size:18px}
}
.ex.skipped{opacity:.75}
.ex.complete{box-shadow:inset 0 0 0 2px var(--good)}
/* Exercice replié : une ligne de la couleur des blocs, qui l'ouvre */
.pick.ex-line{background:var(--surface);border-radius:16px;min-height:54px;padding:7px 16px}
.pick.ex-line:active{background:var(--surface-2)}
.ex-line .exl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ex-line .n{overflow-wrap:anywhere;line-height:1.2}
.ex-line .m{line-height:1.25}
.ex-line.complete .m{color:var(--good)}
.ex-h{gap:2px}
.ex-h .exname{margin:0}
.ex-acts{gap:8px;margin-top:6px}
/* Série en cours : charge et reps avec − et +, puis « Valider la série » */
/* Série en cours : la vedette de l'écran (liseré lumineux et lumière ambiante), − et + de 48 px, chiffres en 26 px */
.cur-set{display:flex;flex-direction:column;gap:10px;border:1px solid transparent;background:radial-gradient(90% 120% at 100% 0%,var(--ambient),transparent 60%) padding-box,linear-gradient(var(--surface-2),var(--surface-2)) padding-box,var(--edge) border-box;border-radius:16px;padding:12px}
.stepper{display:grid;grid-template-columns:58px 48px minmax(0,1fr) 48px;gap:8px;align-items:center}
.cur-set .step{width:48px;height:48px}
.cur-set .fld{min-height:50px}
.cur-set .fld input{font-size:26px}
.st-lab{font-size:15px;color:var(--muted)}
.step{width:44px;height:44px;border-radius:50%;border:none;background:var(--well);color:var(--ink);font-size:26px;font-weight:700;line-height:1;transition:transform .14s}
.step:active{transform:scale(.93)}
.cur-set .fld{background:var(--well);justify-content:center}
.cur-set .fld input{text-align:center}
.cur-set .plyo-lab{text-align:center}
.cur-set .btn:not(.primary){background:var(--well)}
/* Question des reps en réserve : « visé » sous la puce de la valeur visée */
.rir-q{font-weight:600}
.rir-ask .chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:start}
.rir-c{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.rir-c .chip{width:100%;min-width:0;padding-inline:0}
.rir-c .vise{font-size:13px;color:var(--muted)}
.cur-set .chip:not(.on){background:var(--well)}
.rir-ask .link{align-self:flex-start}
.setrow.cardio{grid-template-columns:26px minmax(0,1fr) minmax(0,1fr)}
/* Séries faites (touchées : correction) et à venir */
.set-line{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;min-height:44px;padding:4px 12px 4px 0;border:none;background:transparent;border-radius:12px;text-align:left;color:var(--ink);font-size:17px}
.set-line .sl-v{font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.set-line .sl-ok{color:var(--good);font-weight:800}
/* Texte lu par les lecteurs d'écran seulement */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.set-line.done:active{background:var(--surface-2)}
/* Série tout juste validée : contour orange qui s'allume puis s'éteint, coche qui apparaît (une fois) */
.set-line{position:relative}
.set-line.flash::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--accent),var(--glow-1);opacity:0;animation:setflash .6s ease-out;pointer-events:none}
@keyframes setflash{25%{opacity:1}}
.set-line.flash .sl-ok{display:inline-block;animation:okpop .3s cubic-bezier(.32,.72,0,1)}
@keyframes okpop{from{transform:scale(.4);opacity:0}}
/* Série record : petit trophée doré à la place de la coche ; à la validation, le contour s'allume en or */
.set-line .sl-pr{display:inline-flex;align-items:center;gap:6px;color:var(--gold-ink);font-weight:700;font-size:15px}
.trophy.xs{width:24px;height:24px}
.trophy.xs svg{width:14px;height:14px}
.set-line.pr.flash::after{box-shadow:inset 0 0 0 1.5px var(--gold-ink),var(--glow-gold);animation-duration:.7s}
.set-line.pr.flash .trophy{animation:okpop .5s cubic-bezier(.32,.72,0,1)}
.set-line.next{color:var(--muted)}
.set-line.next .sl-v{font-weight:400}
@media (max-width:360px){
  .stepper{grid-template-columns:44px 44px minmax(0,1fr) 44px;gap:8px}
  .cur-set .step{width:44px;height:44px}
  .cur-set .fld input{font-size:21px}
  .st-lab{font-size:13px}
  .cur-set{padding:10px}
  .pick.ex-line{padding:7px 12px}
}
/* Écrans peu hauts (iPhone SE) : l'en-tête de la séance défile, pour laisser la série en cours visible au-dessus du minuteur */
@media (max-height:700px){.sess-head{position:static}}
details.cue summary{cursor:pointer;color:var(--accent-ink);font-weight:600;font-size:15px;list-style:none}
details.cue summary::-webkit-details-marker{display:none}
details.cue p{font-size:15px;margin-top:6px}
textarea{width:100%;min-height:80px;border:none;border-radius:12px;background:var(--surface-2);padding:10px;resize:vertical}

/* Progrès */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
/* Courbe principale lumineuse, dernier point entouré ; mini-courbe des cases */
.chart .ln{filter:drop-shadow(var(--ring-glow))}
.chart .pt-last{stroke:var(--bg);stroke-width:2;filter:drop-shadow(var(--ring-glow))}
.spark{display:block;width:100%;height:24px;margin-top:4px;overflow:visible}
.spark path{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-size:13px;color:var(--muted);text-align:left;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.num{white-space:nowrap}
.scroll{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
/* Grands chiffres en Archivo étroite : « +12,5% » ou « 125-170 g » tiennent dans une case à 320 px */
.stat .v{font-family:var(--f-display);font-size:32px;font-weight:800;font-stretch:70%;line-height:1;font-variant-numeric:tabular-nums}
@media (max-width:360px){.stat .v{font-size:26px}}
.stat .l{font-size:13px;color:var(--muted)}
/* Anneau de progression (js/ring.js) : piste grise, arc en dégradé orange lumineux, contenu au centre */
.ring{position:relative;display:inline-grid;place-items:center;flex:none;width:132px;height:132px}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .tr{fill:none;stroke:var(--surface-2);stroke-width:11}
.ring .pg{fill:none;stroke-width:11;stroke-linecap:round;filter:drop-shadow(var(--ring-glow))}
.ring .s1{stop-color:#FFB347} .ring .s2{stop-color:#FF7A1A} .ring .s3{stop-color:#FF4D00}
.ring .c{position:relative;text-align:center;line-height:1}
.ring.sm{width:64px;height:64px}
.ring.sm .c{font-size:14px}
.ring.xs{width:46px;height:46px}
.ring.xs .tr,.ring.xs .pg{stroke-width:12}
.ring.xs .c{font-size:13px}
.ring.xxs{width:22px;height:22px}
.ring.xxs .tr,.ring.xxs .pg{stroke-width:16}
.ring-row{display:flex;align-items:center;gap:14px;min-width:0}
.ring.md{width:112px;height:112px}
.ring.md .c{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 8px}
.day-n{font-size:26px}
/* Journal vide : piste en pointillés, pour ne pas confondre avec « 0 » */
.ring.empty .tr{stroke-dasharray:4 7}
/* Dépassé (calories au-delà de 110 %, lipides au-delà du plafond) : arc en ambre */
.ring.over .pg{stroke:var(--warn);filter:none}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.macro{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;font-size:14px}
.macro .label{font-size:13px}
@media (max-width:360px){.ring.md{width:96px;height:96px}.day-n{font-size:22px}}
/* Repas : nom, kcal et « + » rond sur une ligne */
.meal-h{display:flex;align-items:center;gap:10px}
.meal-t{flex:1;gap:0}
/* Fenêtre d'ajout : recherche en grand, scanner en carré orange */
.fd-search{display:flex;gap:8px;align-items:stretch}
.fd-search input{flex:1;min-width:0;width:auto;min-height:52px;border-radius:16px;font-size:17px;padding-inline:16px}
.scan-btn.btn{width:52px;min-height:52px;padding:0;border-radius:16px;flex:none;display:grid;place-items:center;box-shadow:var(--glow-3),inset 0 1px 0 rgba(255,255,255,.45)}
.scan-btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Petits écrans : le compteur de la semaine reste en texte, pour garder « Voir le mois » sur la même ligne */
@media (max-width:360px){.cal .ring.xs{display:none}}
.ring-row > .stack,.ring-row > .kcal{min-width:0}
.mrow{display:grid;grid-template-columns:88px minmax(0,1fr) 74px;gap:8px;align-items:center;font-size:14px}
.mbar{position:relative;height:14px;background:var(--surface-2);border-radius:999px}
.mbar i{position:absolute;left:0;top:0;bottom:0;background:var(--grad-fire);border-radius:999px}
.mbar b{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:var(--court);border-radius:2px}
.mrow .v{text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* Listes et éditeurs */
.hitem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;padding:0}
.hitem .n{font-family:var(--f-display);font-size:20px;font-weight:800;font-stretch:100%}
.hdetail{display:flex;flex-direction:column;gap:6px;font-size:15px;border-top:1px solid var(--line);padding-top:10px}
.item{border:none;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
/* Dans un bloc déjà gris, les contrôles prennent le fond de l'écran pour rester visibles */
.item .f input,.item .f select,.item .fld,.item .chip:not(.on),.item .pick,.item .btn:not(.primary):not(.ghost),.item textarea,.target .btn:not(.primary):not(.ghost),.target .chip:not(.on),.stat .btn:not(.primary):not(.ghost){background:var(--well)}
.item .t{font-weight:700}
.item .fields{grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px}
.item .f input,.item .f select{min-height:40px;padding:6px 8px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:var(--surface-2);border-radius:12px;padding:10px 12px;min-height:52px}
.pick .n{font-weight:700}
.pick .m{font-size:15px;color:var(--muted)}
.pick.on{box-shadow:inset 0 0 0 2px var(--accent-ink),var(--glow-2)}
.card.welcome{align-items:center;text-align:center}
.tpl .tpl-name{font-size:24px;overflow-wrap:anywhere}
.tpl.hero .tpl-name{font-size:30px}
.tpl .tpl-edit{align-self:center}
/* Record : carte dorée (liseré or, lumière ambiante), trophée rond en dégradé or */
.card.gold{border:1px solid transparent;background:radial-gradient(90% 120% at 0% 0%,var(--ambient-gold),transparent 60%) padding-box,linear-gradient(180deg,var(--card-top),var(--card-bot)) padding-box,var(--edge-gold) border-box}
.card.gold h2{color:var(--gold-ink)}
.trophy{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--grad-gold);color:var(--on-accent);box-shadow:var(--glow-gold)}
.trophy svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Fin de séance : anneau des séries, chiffres, effort, records, Émile ; entrée animée une seule fois (.enter) */
.end{display:flex;flex-direction:column;gap:16px}
.end-top{display:flex;align-items:center;gap:16px;min-width:0}
.end-top .ring{width:112px;height:112px}
.end-top .ring .c{display:flex;flex-direction:column;align-items:center;gap:2px}
.end-n{font-size:34px}
.end-t{min-width:0}
.end-t h1{overflow-wrap:anywhere}
.end-emile{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.empty-state{align-items:center;text-align:center;padding-block:24px}
/* Profil : initiale en grand dans le dégradé lumineux, prénom, ancienneté */
.prof-head{display:flex;align-items:center;gap:16px;min-width:0}
.prof-head h1{overflow-wrap:anywhere}
.prof-ini{width:72px;height:72px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--grad-fire);color:var(--on-accent);font-family:var(--f-display);font-weight:800;font-size:34px;box-shadow:var(--glow-1)}
/* Apparence : trois vignettes ; les couleurs de l'aperçu sont celles des thèmes, quel que soit le thème affiché */
.theme-picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.theme-pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px 10px;border:none;border-radius:16px;background:var(--surface-2);font-size:15px;font-weight:600;min-width:0}
@media (max-width:360px){.theme-pick{font-size:12px;padding-inline:2px;letter-spacing:-.01em}}
.theme-pick.on{box-shadow:inset 0 0 0 2px var(--accent-ink),var(--glow-2)}
.tp{display:flex;flex-direction:column;gap:4px;justify-content:flex-end;width:100%;aspect-ratio:4/3;border-radius:10px;padding:8px;box-shadow:inset 0 0 0 1px var(--line)}
.tp i{display:block;height:8px;border-radius:4px;background:#FF7A1A}
.tp i + i{width:60%}
.tp-dark{background:#000000}
.tp-dark i + i{background:#1F1F1F}
.tp-light{background:#F5F5F4}
.tp-light i + i{background:#FFFFFF}
.tp-auto{background:linear-gradient(135deg,#F5F5F4 50%,#000000 50%)}
.tp-auto i + i{background:#A3A3A3}
/* Import d'une sauvegarde : le champ de fichier natif est caché dans un bouton gris (toujours focalisable) */
.file-btn{display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer;align-self:flex-start}
.file-btn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.file-btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
/* Records : une ligne par record (exercice à gauche, force estimée à droite) ; trophée doré dans l'historique */
.rec-line{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px}
.rec-line > span:first-child{min-width:0;overflow-wrap:anywhere;font-weight:600}
.rec-line .num{flex:none;text-align:right;font-weight:800}
.hist-pr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--grad-gold);color:var(--on-accent);vertical-align:2px;box-shadow:var(--glow-gold)}
.hist-pr svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.end-emile .who{font-weight:600;color:var(--good)}
.end-logo{width:96px;height:96px;border-radius:22px;box-shadow:0 0 36px 4px var(--ambient)}
.end.enter .ring .pg{animation:ringfill .7s cubic-bezier(.32,.72,0,1)}
@keyframes ringfill{from{stroke-dashoffset:314.2}}
.end.enter .end-emile{animation:rise .6s cubic-bezier(.32,.72,0,1) .25s backwards}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.end.enter .card.gold{animation:pop .6s cubic-bezier(.32,.72,0,1) .4s backwards}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.02);opacity:1}100%{transform:none}}
.hero-logo{display:block;width:128px;height:128px}

/* Barres fixes */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-top:1px solid var(--glass-line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-wrap{max-width:640px;margin:0 auto;position:relative;touch-action:none}
.tabs-in{position:relative;z-index:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
/* Lentille de verre derrière l'onglet actif (version 3.17) : glisse d'un onglet à l'autre et suit le doigt sur la barre */
.tab-lens{position:absolute;top:0;bottom:0;left:0;width:calc(100% / var(--n,3));transform:translateX(calc(var(--i,0) * 100%));transition:transform .42s var(--ease),opacity var(--dur-state) ease;pointer-events:none}
.tab-lens.off{opacity:0}
.tab-lens::before{content:"";position:absolute;inset:5px 6px;border-radius:var(--r-pill);background:var(--lens);box-shadow:inset 0 1px 0 var(--lens-hi),inset 0 0 0 1px var(--lens-line);transition:transform var(--dur-state) var(--ease)}
.tabs.drag .tab-lens{transition:none}
.tabs.drag .tab-lens::before{transform:scale(1.08,1.12)}
.tab{background:none;border:none;min-height:var(--tabs-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent-ink)}
.tabs.drag .tab.on:not(.near){color:var(--muted)} .tabs.drag .tab.near{color:var(--accent-ink)}
/* Sans flou (navigateur ancien) : verre opaque, pour garder le texte lisible */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.top,.tabs{background:var(--bg)}}
.tab .dot{position:absolute;top:10px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
.restbar{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));z-index:29;padding:0 16px 10px}
/* Minuteur en verre : anneau du temps qui reste, le temps et les boutons sur une ligne, le nom de l'exercice dessous sur toute la largeur */
.restbar-in{max-width:608px;margin:0 auto;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-line);color:var(--ink);border-radius:20px;padding:8px 12px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.rest-ring.ring{width:44px;height:44px}
.rest-ring .tr,.rest-ring .pg{stroke-width:12}
.rest-ring .pg{transition:stroke-dashoffset .25s linear}
.restbar.end .rest-ring .pg{stroke:var(--good);filter:none}
.restbar.end .rest-ring{animation:okpop .5s cubic-bezier(.32,.72,0,1)}
.restbar.end .rl{color:var(--good)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.restbar-in{background:var(--surface)}}
.restbar .rt{font-family:var(--f-display);font-size:30px;font-weight:800;font-stretch:100%;font-variant-numeric:tabular-nums;min-width:72px;margin-right:auto}
/* Une seule ligne : l'essentiel (série suivante, exercice suivant) en premier, la fin coupée au besoin */
.restbar .rl{order:3;flex-basis:100%;font-size:15px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar button{background:var(--surface-2);color:var(--ink);border:none;border-radius:999px;padding:6px 14px;font-weight:700;min-height:44px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs-h) + 84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center}
/* Petits écrans : anneau, temps, « +15 s » et « Passer » tiennent sur une ligne */
@media (max-width:360px){.restbar-in{gap:2px 8px}.restbar .rt{font-size:26px;min-width:0}.restbar button{padding:6px 10px;font-size:16px}}
#restbar:not([hidden]) ~ .toast{bottom:calc(var(--tabs-h) + 140px + env(safe-area-inset-bottom,0px))}
.empty{color:var(--muted);font-size:15px;padding:8px 0}
/* Fiche d'exercice : photos du mouvement (départ, arrivée) et silhouette des muscles travaillés */
input[type=search]{-webkit-appearance:none;appearance:none}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos figure{margin:0;display:flex;flex-direction:column;gap:4px}
.photos img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.photos figcaption{font-size:13px;color:var(--muted);text-align:center}
.bodymap{display:block;width:100%;max-width:260px;height:auto;margin:0 auto}
.bodymap path{fill:var(--surface-2);stroke:var(--line);stroke-width:.8;stroke-linejoin:round}
.bodymap path.p{fill:var(--accent);stroke:var(--accent-ink)}
.bodymap path.s{fill:var(--accent);fill-opacity:.35;stroke:var(--accent)}
.bodymap text{fill:var(--muted);font-size:10px;text-anchor:middle;font-family:var(--f-body)}
/* « Voir le mouvement » : départ et arrivée superposés, en alternance (2,9 s : chaque photo 1,2 s, fondu 0,25 s), figés au toucher */
.mv{display:flex;flex-direction:column;gap:12px}
.mv-photos{display:grid;width:100%;padding:0;border:none;border-radius:14px;overflow:hidden;background:var(--surface-2);aspect-ratio:3/2}
.mv-photos img{grid-area:1/1;display:block;width:100%;height:100%;object-fit:cover}
.mv-photos .mv-a,.mv-cap .mv-la{animation:mv-a 2.9s infinite}
.mv-photos .mv-b,.mv-cap .mv-lb{animation:mv-b 2.9s infinite}
@keyframes mv-a{0%,41%{opacity:1}50%,91%{opacity:0}100%{opacity:1}}
@keyframes mv-b{0%,41%{opacity:0}50%,91%{opacity:1}100%{opacity:0}}
.mv.paused .mv-photos img,.mv.paused .mv-cap .mv-l{animation-play-state:paused}
.mv-cap{display:flex;justify-content:center;flex-wrap:wrap;gap:0 6px;font-size:15px;color:var(--muted);margin-top:-4px}
.mv-ls{display:grid;font-weight:600;color:var(--ink)}
.mv-l{grid-area:1/1}
.mv-hint::before,.mv-p::before{content:'· '}
.mv-p{display:none}
.mv.paused .mv-p{display:inline}
.mv.paused .mv-hint{display:none}
.mv-cue{gap:4px}
@media (max-width:360px){.mv-cap{flex-direction:column;align-items:center}.mv-hint::before,.mv-p::before{content:none}}
.bodymap.big{max-width:none}
/* Silhouette en 3D : carte qui pivote autour de l'axe vertical, une face de chaque côté, ombre au sol qui s'affine de profil */
.bm3d{display:flex;flex-direction:column;align-items:center;gap:var(--s-2)}
.bm3d-stage{position:relative;width:100%;height:300px;perspective:900px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.bm3d-card{position:absolute;inset:0 0 18px;transform-style:preserve-3d;transform:rotateY(var(--ry,0deg));transition:transform .6s var(--ease)}
.bm3d.turning .bm3d-card{transition:none}
.bm3d.turning .bm3d-stage{cursor:grabbing}
.bm3d-card .bodymap{position:absolute;inset:0;width:100%;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.bm3d-card .bm-back{transform:rotateY(180deg)}
.bm3d-floor{position:absolute;left:50%;bottom:2px;width:120px;height:16px;margin-left:-60px;border-radius:50%;background:radial-gradient(closest-side,var(--shade),transparent);transform:scaleX(var(--sx,1));transition:transform .6s var(--ease)}
.bm3d.turning .bm3d-floor{transition:none}
.bm3d-hint{text-align:center}
.legend.big{flex-direction:column;gap:4px;font-size:15px;color:var(--ink)}
.legend.big i{border-radius:50%}
.legend .lg-p{background:var(--accent)}
.legend .lg-s{background:var(--accent);opacity:.35}
details.cue[open]{display:flex;flex-direction:column;gap:10px}
/* Émile, le coach : avatar rond tiré du logo et bulle signée */
.emile{display:flex;gap:10px;align-items:flex-start;text-align:left}
.emile>img{width:44px;height:44px;border-radius:50%;flex:none;border:2px solid var(--accent);background:#000000}
.emile .bubble{flex:1;min-width:0;background:linear-gradient(180deg,var(--card-top),var(--card-bot));box-shadow:var(--card-sh);border:none;border-radius:4px var(--r) var(--r) var(--r);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.emile .who{font-weight:600;font-size:15px;color:var(--ink)}
/* Bulle posée dans un bloc : fond gris pour garder sa forme */
.card .emile .bubble{background:var(--surface-2);box-shadow:none}
.card .emile .bubble .btn:not(.primary):not(.ghost),.card .emile .bubble .chip:not(.on){background:var(--well)}
.emile .bubble .row.between{min-height:0}
.emile .bubble .link{min-height:0;padding:0}
.emile-x{width:32px;height:32px;margin:-6px -8px -6px 0;flex:none;border:none;border-radius:50%;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:background-color .14s ease,transform .14s ease}
.emile-x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.emile-x:active{background:var(--surface-2);transform:scale(.9)}
/* Teinte de la bulle selon le ton : orange (conseil), vert (réussite), ambre (prudence), rouge (alerte) */
.emile .bubble{background:linear-gradient(135deg,var(--tint) 0%,transparent 60%),linear-gradient(180deg,var(--card-top),var(--card-bot))}
.card .emile .bubble{background:linear-gradient(135deg,var(--tint) 0%,transparent 60%),var(--surface-2)}
.emile{--tint:var(--accent-soft)}
.emile.good{--tint:var(--good-soft)} .emile.warn{--tint:var(--warn-soft)} .emile.bad{--tint:var(--bad-soft)}
.emile.good>img{border-color:var(--good)} .emile.warn>img{border-color:var(--warn)} .emile.bad>img{border-color:var(--bad)}
.stats.needs{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat.wide{grid-column:1/-1}
.stat .v small{font-family:var(--f-body);font-size:15px;font-weight:600;color:var(--muted)}
#goal-card{scroll-margin-top:72px}
/* Aujourd'hui : ligne compacte du suivi du jour (nom, valeur, geste rapide), qui s'ouvre sur place ; lien vers les autres conseils d'Émile */
.card.line{padding:4px 8px 4px 16px;gap:0}
.line-row{display:flex;align-items:center;gap:8px;min-height:52px}
.line-h{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;text-align:left;min-height:44px;color:inherit}
.line-h .n{font-weight:600;flex:none}
.line-h .ring{margin-left:auto}
.line-h .ring + .v{margin-left:0}
.line-h .v{margin-left:auto;min-width:0;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line-h svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);transition:transform .14s ease}
.line-h[aria-expanded="true"] svg{transform:rotate(90deg)}
.line-row .btn{flex:none;padding-inline:14px}
.line-body{display:flex;flex-direction:column;gap:12px;padding:4px 8px 12px 0}
.emile-more{align-self:flex-start;margin-top:-10px}
/* Alimentation : journée, barres des nutriments, caméra pour les codes-barres */
.daynav b{font-family:var(--f-display);font-size:20px;font-weight:800;font-stretch:100%}
.kcal .v{font-family:var(--f-display);font-size:40px;font-weight:800;font-stretch:100%;line-height:1}
/* Grand chiffre, unité petite et grise */
.kcal small{font-size:17px;font-weight:600;color:var(--muted);margin-left:4px}
.food-today .kcal{display:flex;flex-direction:column;gap:4px}
.mbar.big{height:14px}
.mbar.water i{background:var(--court)}
/* Objectif d'eau modifiable : champ en litres à côté du retour au repère */
.water-goal{gap:6px}
.water-goal .fld{width:112px;flex:none}
.pick.static{cursor:default}
.pick.static:active{background:var(--surface-2)}
.pick.static.planned{border:1px dashed var(--muted)}
.mrow.fd{grid-template-columns:72px minmax(0,1fr) 104px}
/* Raccourci du journal (habituel, repas passé, repas enregistré) : nom et détail, puis « + » rond qui ajoute d'un geste */
.quick{display:flex;align-items:center;gap:8px}
.quick > .pick{flex:1;min-width:0}
.quick .ql{display:flex;flex-direction:column;gap:2px;min-width:0}
.quick .n,.quick .m{overflow-wrap:anywhere}
/* Titres saisis (nom d'un repas enregistré) : un mot très long passe à la ligne au lieu de déborder */
#app h1{overflow-wrap:break-word}
button.plus{flex:none;width:44px;height:44px;border-radius:50%;border:none;background:var(--surface-2);color:var(--accent-ink);font-size:26px;font-weight:700;line-height:1;transition:transform .14s}
button.plus:active{transform:scale(.93)}
/* Supprimer une activité (écran d'un jour) : bouton rond avec une corbeille */
button.plus.del{color:var(--bad)}
.quick .mk{margin-right:6px;vertical-align:1px}
button.plus svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meal > .link{align-self:flex-start}
.qgroup{gap:8px}
/* Repas enregistré : ses aliments, une ligne chacun (nom à gauche, quantité et kcal à droite) */
.sm-list{gap:6px}
.sm-item{display:flex;justify-content:space-between;gap:12px}
.sm-item > span:first-child{min-width:0;overflow-wrap:anywhere}
.sm-item .num{flex:none;white-space:nowrap}
.pick .num{font-weight:700;white-space:nowrap}
.scan{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan .aim{position:absolute;left:10%;right:10%;top:30%;bottom:30%;border:3px solid var(--accent);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.sci h3{font-size:18px}
.sci p{font-size:15px}
.sci .src{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand"><img src="icons/logo.png" alt="" width="32" height="32">LOUTRONS</div>
  <button type="button" id="me" class="me" data-act="profile" aria-label="Ton profil et les réglages" hidden></button>
</div></header>

<main id="app"><p class="loading">Chargement du carnet…</p></main>

<div id="restbar" class="restbar" hidden><div class="restbar-in">
  <span class="ring rest-ring" aria-hidden="true"><svg viewBox="0 0 120 120"><defs><linearGradient id="rest-g" x1="0" y1="0" x2="1" y2="1"><stop class="s1" offset="0"/><stop class="s2" offset=".5"/><stop class="s3" offset="1"/></linearGradient></defs><circle class="tr" cx="60" cy="60" r="50"/><circle class="pg" id="rest-arc" cx="60" cy="60" r="50" stroke="url(#rest-g)" stroke-dasharray="314.2" stroke-dashoffset="0"/></svg></span>
  <span class="rt" id="rest-time">0:00</span>
  <span class="rl" id="rest-label">Repos</span>
  <button type="button" data-act="rest-add">+15 s</button>
  <button type="button" data-act="rest-stop">Passer</button>
</div></div>

<div id="toast" class="toast" role="status" hidden></div>

<nav class="tabs" aria-label="Navigation"><div class="tabs-wrap"><span class="tab-lens off" id="tab-lens" aria-hidden="true"></span><div class="tabs-in" id="tabs"></div></div></nav>

<script type="module" src="js/app.js"></script>

</body>
</html>
